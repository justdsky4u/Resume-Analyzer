# Render service definition for app-backend
services:
  - type: web
    name: ai-decision-backend
    env: python
    region: oregon
    plan: free
    buildCommand: 'python -m pip install -r requirements.txt'
    startCommand: '.venv\\Scripts\\python.exe -m uvicorn app_back:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
